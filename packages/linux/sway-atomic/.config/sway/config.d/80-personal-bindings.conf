# Personal shortcuts layered over Fedora's stock Sway session.
bindsym --no-warn $mod+Return exec sh -c 'if command -v ghostty >/dev/null; then exec ghostty; else exec foot; fi'
bindsym --no-warn $mod+space exec $menu

# Move windows with Control; move workspaces between displays with Shift.
bindsym $mod+Control+$left move left
bindsym $mod+Control+$down move down
bindsym $mod+Control+$up move up
bindsym $mod+Control+$right move right
bindsym $mod+Control+Left move left
bindsym $mod+Control+Down move down
bindsym $mod+Control+Up move up
bindsym $mod+Control+Right move right
bindsym --no-warn $mod+Shift+$left move workspace to output left
bindsym --no-warn $mod+Shift+$down move workspace to output down
bindsym --no-warn $mod+Shift+$up move workspace to output up
bindsym --no-warn $mod+Shift+$right move workspace to output right
bindsym --no-warn $mod+Shift+Left move workspace to output left
bindsym --no-warn $mod+Shift+Down move workspace to output down
bindsym --no-warn $mod+Shift+Up move workspace to output up
bindsym --no-warn $mod+Shift+Right move workspace to output right

# Second bank of workspaces; Control sends the focused window to either bank.
bindsym --no-warn $mod+Shift+1 workspace number 11
bindsym --no-warn $mod+Shift+2 workspace number 12
bindsym --no-warn $mod+Shift+3 workspace number 13
bindsym --no-warn $mod+Shift+4 workspace number 14
bindsym --no-warn $mod+Shift+5 workspace number 15
bindsym --no-warn $mod+Shift+6 workspace number 16
bindsym --no-warn $mod+Shift+7 workspace number 17
bindsym --no-warn $mod+Shift+8 workspace number 18
bindsym --no-warn $mod+Shift+9 workspace number 19
bindsym --no-warn $mod+Shift+0 workspace number 20

bindsym $mod+Control+1 move container to workspace number 1
bindsym $mod+Control+2 move container to workspace number 2
bindsym $mod+Control+3 move container to workspace number 3
bindsym $mod+Control+4 move container to workspace number 4
bindsym $mod+Control+5 move container to workspace number 5
bindsym $mod+Control+6 move container to workspace number 6
bindsym $mod+Control+7 move container to workspace number 7
bindsym $mod+Control+8 move container to workspace number 8
bindsym $mod+Control+9 move container to workspace number 9
bindsym $mod+Control+0 move container to workspace number 10

bindsym $mod+Control+Shift+1 move container to workspace number 11
bindsym $mod+Control+Shift+2 move container to workspace number 12
bindsym $mod+Control+Shift+3 move container to workspace number 13
bindsym $mod+Control+Shift+4 move container to workspace number 14
bindsym $mod+Control+Shift+5 move container to workspace number 15
bindsym $mod+Control+Shift+6 move container to workspace number 16
bindsym $mod+Control+Shift+7 move container to workspace number 17
bindsym $mod+Control+Shift+8 move container to workspace number 18
bindsym $mod+Control+Shift+9 move container to workspace number 19
bindsym $mod+Control+Shift+0 move container to workspace number 20

# Layout, splits, scratchpad, and direct resizing.
bindsym --no-warn $mod+Shift+e focus parent
bindsym $mod+Control+space focus mode_toggle
bindsym $mod+Shift+s sticky toggle
bindsym $mod+Shift+grave move scratchpad
bindsym $mod+grave exec ~/.local/bin/scratchpad-toggle
bindsym --no-warn $mod+minus splitv
bindsym $mod+backslash splith
bindsym $mod+Alt+$left resize shrink width 40px
bindsym $mod+Alt+$right resize grow width 40px
bindsym $mod+Alt+$up resize shrink height 40px
bindsym $mod+Alt+$down resize grow height 40px

# Screenshots and lock screen.
bindsym --no-warn Print exec grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bindsym $mod+Ctrl+s exec grim -g "$(slurp)" - | wl-copy
bindsym $mod+Shift+Print exec grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bindsym $mod+Escape exec loginctl lock-session

# Voice dictation, clipboard history, and project launcher.
bindsym --no-warn $mod+a exec sh -c 'if command -v handy >/dev/null; then exec handy --toggle-transcription; else notify-send "Handy is not installed"; fi'
bindsym --no-warn $mod+v exec sh -c 'sel=$("$HOME/.local/bin/cliphist" list | rofi -dmenu); [ -n "$sel" ] && printf "%s" "$sel" | "$HOME/.local/bin/cliphist" decode | wl-copy'
exec wl-paste --watch ~/.local/bin/cliphist store
bindsym $mod+p exec sh -c 'if command -v ghostty >/dev/null; then exec ghostty --class=com.sirhamy.FloatingLauncher -e "$HOME/.local/bin/zellij-sessionizer"; else exec foot --app-id=com.sirhamy.FloatingLauncher "$HOME/.local/bin/zellij-sessionizer"; fi'
for_window [app_id="com.sirhamy.FloatingLauncher"] floating enable, resize set 800 500, move position center
