# Match the HAMY desktop theme without overriding hardware-specific outputs.
font pango:IBM Plex Sans 11

default_border pixel 1
default_floating_border pixel 1
gaps inner 4
gaps outer 2

# Window colors          border  background text    indicator child_border
client.focused           #dedede #0d0d0d    #dedede #dedede   #dedede
client.focused_inactive  #1e2127 #0d0d0d    #5e6570 #1e2127   #1e2127
client.unfocused         #0d0d0d #0d0d0d    #5e6570 #0d0d0d   #0d0d0d
client.urgent            #e06c75 #0d0d0d    #dedede #e06c75   #e06c75

output * bg ~/.config/sway/wallpaper.png fill
